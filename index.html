<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyMate LK</title>
    <meta name="description" content="Comprehensive A/L study companion with syllabus tracking, interactive exam performance charts, subject notes & file repository, focus timer, and AI tutor." />
    <meta property="og:title" content="StudyMate LK" />
    <meta property="og:description" content="Comprehensive A/L study companion with syllabus tracking, interactive exam performance charts, subject notes & file repository, focus timer, and AI tutor." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA Web App Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StudyMate LK" />

    <!-- Synchronous zero-flash theme & dark mode initialization -->
    <script>
      (function() {
        try {
          // Initialize dark mode
          var savedDark = localStorage.getItem('studymate_theme');
          var isDark = savedDark === 'dark' || (!savedDark && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }

          // Initialize custom accent color
          var savedAccent = localStorage.getItem('studymate_theme_accent') || '#2563eb';
          if (/^#[0-9A-Fa-f]{6}$/.test(savedAccent)) {
            var c = savedAccent.substring(1);
            var r = parseInt(c.substring(0, 2), 16);
            var g = parseInt(c.substring(2, 4), 16);
            var b = parseInt(c.substring(4, 6), 16);
            var root = document.documentElement;
            root.style.setProperty('--primary', savedAccent);
            root.style.setProperty('--primary-rgb', r + ', ' + g + ', ' + b);
            root.style.setProperty('--primary-light', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.08)');
            root.style.setProperty('--primary-light-dark', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.18)');
            root.style.setProperty('--primary-light-border', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.28)');
            root.style.setProperty('--primary-glow', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.35)');
            var yiq = (r * 299 + g * 587 + b * 114) / 1000;
            root.style.setProperty('--primary-contrast', yiq >= 150 ? '#0f172a' : '#ffffff');
          }

          // Initialize custom canvas background
          var savedCanvasBg = localStorage.getItem('canvas-bg') || localStorage.getItem('studymate_canvas_bg') || '#0d1117';
          document.documentElement.style.setProperty('--canvas-bg', savedCanvasBg);

          // Initialize custom background & surface canvas
          var savedBg = localStorage.getItem('studymate_theme_bg');
          var savedSurface = localStorage.getItem('studymate_theme_surface');
          if (savedBg && /^#[0-9A-Fa-f]{6}$/.test(savedBg)) {
            var root = document.documentElement;
            root.setAttribute('data-custom-bg', 'true');
            root.style.setProperty('--bg-canvas', savedBg);
            var bc = savedBg.substring(1);
            var br = parseInt(bc.substring(0, 2), 16);
            var bg = parseInt(bc.substring(2, 4), 16);
            var bb = parseInt(bc.substring(4, 6), 16);
            var byiq = (br * 299 + bg * 587 + bb * 114) / 1000;
            var isBgDark = byiq < 140;
            var sHex = (savedSurface && /^#[0-9A-Fa-f]{6}$/.test(savedSurface))
              ? savedSurface
              : (isBgDark ? '#1e293b' : '#ffffff');
            var sc = sHex.substring(1);
            var sr = parseInt(sc.substring(0, 2), 16);
            var sg = parseInt(sc.substring(2, 4), 16);
            var sb = parseInt(sc.substring(4, 6), 16);
            var syiq = (sr * 299 + sg * 587 + sb * 114) / 1000;
            var isSurfaceDark = syiq < 140;
            if (isBgDark || isSurfaceDark) {
              root.classList.add('dark');
            }
            root.style.setProperty('--bg-surface', sHex);
            root.style.setProperty('--bg-surface-elevated', sHex);
            root.style.setProperty('--bg-surface-subtle', (isBgDark || isSurfaceDark) ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.04)');
            root.style.setProperty('--border-surface', (isBgDark || isSurfaceDark) ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.08)');
          }
        } catch (e) {}

        // Listen to the bg-picker (change and input events) and update --canvas-bg instantly and save to localStorage
        function setupBgPicker() {
          var bgPicker = document.getElementById('bg-picker');
          if (bgPicker) {
            var savedColor = localStorage.getItem('canvas-bg') || localStorage.getItem('studymate_canvas_bg') || '#0d1117';
            bgPicker.value = savedColor;
            document.documentElement.style.setProperty('--canvas-bg', savedColor);
            document.body.style.setProperty('--canvas-bg', savedColor);

            function onColorUpdate(e) {
              var color = e.target.value;
              document.documentElement.style.setProperty('--canvas-bg', color);
              document.body.style.setProperty('--canvas-bg', color);
              localStorage.setItem('canvas-bg', color);
              localStorage.setItem('studymate_canvas_bg', color);
            }
            bgPicker.addEventListener('input', onColorUpdate);
            bgPicker.addEventListener('change', onColorUpdate);
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupBgPicker);
        } else {
          setupBgPicker();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
